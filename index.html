<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>BAP Digital — Lapas Narkotika Jakarta</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2c5282;--gold:#c9a227;--bg:#f2f4f7;--card:#fff;--line:#d9dee5;--txt:#1d2433;--mut:#667085;--ok:#13795b;--err:#b42318;--warn:#b54708;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px calc(10px);position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0003}
header .t{font-weight:700;font-size:16px;letter-spacing:.2px}
header .s{font-size:12px;opacity:.8}
header .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
nav.tabs{display:flex;gap:6px;margin-top:10px}
nav.tabs button{flex:1;background:#ffffff1f;border:0;color:#fff;padding:8px;border-radius:8px;font-weight:600;font-size:14px}
nav.tabs button.on{background:#fff;color:var(--navy)}
main{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.hint{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#344054}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--txt)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #2c528255;border-color:var(--navy2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.sec{background:#e8edf4;color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fde8e6;color:var(--err)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--navy)}
.chip:active{background:#e8edf4}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.stepper button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stepper button.done{color:var(--ok);border-color:#a6dcc6}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between;z-index:15;backdrop-filter:blur(6px)}
.foot .btn{flex:1;max-width:260px}
.qa{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfe}
.qa .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qa .no{font-weight:700;color:var(--navy)}
.qa .tools{display:flex;gap:4px}
.qa .tools button{border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:30px;font-size:14px}
.qa textarea{min-height:56px}
.mic{position:relative}
.mic button{position:absolute;right:6px;bottom:8px;border:0;background:#e8edf4;border-radius:50%;width:34px;height:34px;font-size:16px}
.mic button.rec{background:#fee4e2;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.1)}}
.mic textarea{padding-right:46px}
.tim{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.tim.on{border-color:var(--navy2);background:#f1f5fb}
.tim input[type=checkbox]{width:22px;height:22px;flex:none}
.tim .nm{flex:1;min-width:0}
.tim .nm b{display:block;font-size:14px}
.tim .nm small{color:var(--mut);font-size:12px}
.tim select{width:auto;padding:6px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.thumb img{width:100%;height:110px;object-fit:cover;display:block}
.thumb .b{padding:6px}
.thumb input{padding:6px;font-size:12px}
.thumb .act{display:flex;gap:4px;margin-top:4px}
.thumb .act button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px;font-size:12px}
.grp{font-weight:700;color:var(--navy);margin:12px 0 6px;font-size:13.5px}
.sig{border:1.5px dashed #98a2b3;border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.sigbox{margin-bottom:14px}
.sigbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:13.5px;font-weight:600}
.list .it{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.list .it b{color:var(--navy)}
.list .meta{font-size:12.5px;color:var(--mut)}
.list .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#fef0c7;color:var(--warn);font-weight:600}
.badge.ok{background:#d1fadf;color:var(--ok)}
.check li{margin:3px 0}
.check .x{color:var(--err)}
.check .v{color:var(--ok)}
.prev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;font-family:"Times New Roman",serif;font-size:14px;max-height:60vh;overflow:auto}
.prev h4{text-align:center;margin:6px 0}
.prev .c{text-align:center}
.prev table{border-collapse:collapse;width:100%;font-size:13px}
.prev td,.prev th{padding:2px 4px;vertical-align:top}
.prev table.b td,.prev table.b th{border:1px solid #000}
.ov{position:fixed;inset:0;background:#0b1220b3;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov .box{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center}
.spin{width:42px;height:42px;border:4px solid #e4e7ec;border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:420px;margin:30px auto}
.logo{width:64px;height:64px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:20px;margin:0 auto 10px}
.warnbar{background:#fef0c7;color:#7a2e0e;border:1px solid #fedf89;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.res a{display:block;margin:8px 0}
.small{font-size:12.5px;color:var(--mut)}
.rowb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{header,.foot,.stepper,.noprint{display:none!important}main{padding:0}.prev{max-height:none;border:0}}
</style>
</head>
<body>
<header>
  <div class="row">
    <div>
      <div class="t">BAP Digital</div>
      <div class="s">Lapas Narkotika Kelas IIA Jakarta</div>
    </div>
    <div id="hdUser" class="s" style="text-align:right"></div>
  </div>
  <nav class="tabs" id="tabs" style="display:none">
    <button data-tab="baru" class="on">BAP Baru</button>
    <button data-tab="riwayat">Riwayat</button>
    <button data-tab="akun">Akun</button>
  </nav>
</header>

<main id="app"></main>
<div class="foot" id="foot" style="display:none">
  <button class="btn sec" id="btnPrev">‹ Kembali</button>
  <button class="btn" id="btnNext">Lanjut ›</button>
</div>

<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileFoto" accept="image/*" multiple hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileDok" accept=".pdf,image/*,.doc,.docx" multiple hidden>
<input type="file" id="fileSusulan" accept=".pdf,image/*" multiple hidden>

<script>
/* ============================================================
   KONFIGURASI — https://script.google.com/macros/s/AKfycbxEN9Yd17MbLEw1jkXek2exJjCewa1GbnBAR-CQgqMpM39AHI7k8Rek_UN-q-ffk0sBaw/exec
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxEN9Yd17MbLEw1jkXek2exJjCewa1GbnBAR-CQgqMpM39AHI7k8Rek_UN-q-ffk0sBaw/exec';

/* ======================= TEMPLATE ======================= */
const LAPAS = 'Lapas Narkotika Kelas IIA Jakarta';
const TPL = {
  pembuka: [
    ['Apakah saudara dalam keadaan sehat Jasmani dan Rohani?', 'Sehat'],
    ['Apakah saudara mengetahui mengapa saudara diperiksa?', 'Tahu'],
    ['Saudara dipanggil Petugas Tim Pemeriksa dari ' + LAPAS + ' terkait dugaan pelanggaran tata tertib yang saudara lakukan. Apakah saudara siap diperiksa?', 'Siap'],
    ['Apakah saudara berjanji mau memberikan keterangan yang sebenar-benarnya?', 'Saya berjanji'],
    ['Kapan saudara masuk ke ' + LAPAS + '?', ''],
    ['Pada blok kamar mana saudara ditempatkan?', '{blok}']
  ],
  hp: [
    ['Apakah benar {barang} yang ditemukan pada {temuan} adalah milik saudara?', ''],
    ['Sudah berapa lama saudara menggunakan alat komunikasi tersebut?', ''],
    ['Dari mana saudara memperoleh alat komunikasi tersebut?', ''],
    ['Saudara beli dengan harga berapa alat komunikasi tersebut?', ''],
    ['Saudara mendapatkan uang dari mana untuk membeli alat komunikasi tersebut?', ''],
    ['Saudara gunakan untuk apa saja alat komunikasi tersebut?', ''],
    ['Bagaimana cara alat komunikasi tersebut masuk ke dalam Lapas?', '']
  ],
  narkoba: [
    ['Apakah saudara masih mengkonsumsi narkoba?', ''],
    ['Darimana saudara memperoleh narkoba tersebut?', ''],
    ['Coba saudara jelaskan kronologi terkait penyelundupan narkoba tersebut?', ''],
    ['Berapa kali saudara melakukan penyelundupan narkoba kedalam Lapas?', ''],
    ['Coba saudara jelaskan berapa banyak narkoba yang telah saudara selundupkan kedalam Lapas?', ''],
    ['Siapa saja yang terlibat dalam penyelundupan tersebut?', ''],
    ['Saudara jual dengan harga berapa narkoba tersebut?', ''],
    ['Atas dasar apa saudara menyelundupkan narkoba kedalam Lapas?', '']
  ],
  penutup: [
    ['Apakah saudara pernah mengikuti kegiatan sosialisasi tentang tata tertib di ' + LAPAS + '?', 'Ya, pernah'],
    ['Apakah saudara sadar dan mengetahui bahwa apa yang saudara lakukan melanggar tata tertib?', 'Saya sadar'],
    ['Apakah saudara bersedia menerima sanksi atas apa yang saudara lakukan?', 'Saya bersedia'],
    ['Apakah ada keterangan lain yang ingin saudara sampaikan?', '']
  ]
};
const PASAL = {
  'HP — Pasal 26 huruf i': 'Pasal 26 huruf i:\n"memiliki, membawa, atau menggunakan alat komunikasi atau alat elektronik"',
  'Narkoba — Pasal 26 huruf k': 'Pasal 26 huruf k:\n"membuat, membawa, menyimpan, mengedarkan, atau mengkonsumsi narkotika dan obat terlarang serta zat adiktif lainnya"'
};
const SARAN_STD = 'Sesuai dengan Undang-Undang Nomor 22 Tahun 2022 tentang Pemasyarakatan dan Peraturan Menteri Hukum dan HAM Nomor 8 Tahun 2024 tentang Penyelenggaraan Keamanan Dan Ketertiban Pada Satuan Kerja Pemasyarakatan Pasal 45 Ayat 5 a dan b yaitu: Penempatan dalam sel pengasingan paling lama 12 (dua belas) hari, Penundaan atau pembatasan hak bersyarat dan dicatat dalam buku Register F.';
const JUDUL_FOTO = ['Materi Laporan Pengaduan', 'Identitas Pelapor', 'Bukti Laporan Pengaduan',
  'Verifikasi Identitas Warga Binaan pada SDP', 'Giat Sidak / Penggeledahan', 'Alat Komunikasi Milik Warga Binaan',
  'Barang Bukti', 'Pemeriksaan Warga Binaan'];
const STEPS = ['Kasus', 'Tim', 'Warga Binaan', 'Tanya Jawab', 'Resume', 'Lampiran', 'Tanda Tangan', 'Kirim'];

/* ======================= STATE ======================= */
const S = { token: '', user: null, tab: 'baru', step: 0, master: null, hasil: null, riwayat: null, cari: '' };
let D = draftBaru();

function hariIni() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function draftBaru(keep) {
  const x = {
    kasus: { ringkasan: '', kronologi: '', perihal: '', barang: '', temuan: '', disposisi: { nomor: '', tanggal: '', perihal: '' }, dasarTambahan: '' },
    st: { buat: true, nomor: '', tanggal: hariIni() },
    tim: [],
    bap: { jenis: 'Narapidana', nomor: '', tanggal: hariIni(), jam: '', tempat: '' },
    wbp: { nama: '', umur: '', agama: 'Islam', noreg: '', wn: 'Indonesia', blok: '', perkara: '', hukuman: '', ekspirasi: '' },
    tanyaJawab: [],
    resume: { keterangan: '', meringankan: 'Yang bersangkutan berbicara terus terang dan tidak berbelit-belit.', memberatkan: '', tingkat: 'berat', pasal: '', uraian: '', saran: SARAN_STD },
    lampiran: [], dokumen: [],
    ttd: { mode: 'basah', diperiksa: '', tim: {} },
    klasifikasi: 'Biasa', terlapor: []
  };
  if (keep) { x.kasus = keep.kasus; x.st = keep.st; x.tim = keep.tim; x.bap.tanggal = keep.bap.tanggal; x.bap.jenis = keep.bap.jenis; x.ttd.mode = keep.ttd.mode; x.klasifikasi = keep.klasifikasi || 'Biasa'; x.terlapor = keep.terlapor || []; }
  return x;
}

/* ======================= PENYIMPANAN DRAF (IndexedDB) ======================= */
const IDB = {
  db: null,
  open() { return new Promise((res) => { try { const r = indexedDB.open('bap-digital', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } }); },
  set(k, v) { return new Promise((res) => { if (!this.db) return res(); try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
  del(k) { return new Promise((res) => { if (!this.db) return res(); try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
  get(k) { return new Promise((res) => { if (!this.db) return res(null); try { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); }
};
let saveT;
const kunciDraf = () => 'draf_' + (S.user ? S.user.nip : 'x');
function simpanDraf() { clearTimeout(saveT); saveT = setTimeout(() => { if (S.user) IDB.set(kunciDraf(), { D, step: S.step }); }, 400); }

/* ======================= UTIL ======================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function getP(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setP(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k) => { a = a[k]; }); a[ks[ks.length - 1]] = v; }
function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); }
function overlay(html) { const o = $('#ov'); if (!html) { o.style.display = 'none'; return; } $('#ovBox').innerHTML = html; o.style.display = 'flex'; }
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function tglObj(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; const y = +m[1], mo = +m[2], d = +m[3]; return { y, m: mo, d, dow: new Date(y, mo - 1, d).getDay() }; }
function tglPanjang(s) { const t = tglObj(s); return t ? t.d + ' ' + BULAN[t.m] + ' ' + t.y : ''; }
function lines(s) { return String(s || '').split('\n').map((x) => x.trim()).filter(Boolean); }
function isi(t) { return String(t || '').replace(/\{blok\}/g, D.wbp.blok || '').replace(/\{barang\}/g, D.kasus.barang || '[barang temuan]').replace(/\{temuan\}/g, D.kasus.temuan || '[giat & lokasi temuan]'); }
function urutTim(t) { return t.slice().sort((a, b) => (/ketua/i.test(b.tugas) ? 1 : 0) - (/ketua/i.test(a.tugas) ? 1 : 0)); }

async function api(action, data) {
  if (!API_URL || API_URL.indexOf('http') !== 0) throw new Error('API_URL belum diisi di index.html (mode uji coba).');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, data }) });
  const j = await r.json();
  if (j.sesiHabis) { overlay(); keluar(false); toast('Sesi berakhir. Silakan masuk kembali — draf tetap tersimpan.', 4500); throw new Error('Sesi berakhir'); }
  if (j.wajibGanti) { S.user.wajibGanti = true; overlay(); render(); throw new Error('Ganti PIN dulu'); }
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j;
}

function kompres(file, max = 1600, q = 0.78) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img; const r = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * r); h = Math.round(h * r);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => rej(new Error('Gambar tidak bisa dibaca'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(fr.error); fr.readAsDataURL(file);
  });
}
function bacaFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); }); }
function ukuran(dataUrl) { return Math.round((dataUrl.length - dataUrl.indexOf(',')) * 0.75); }
function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

/* ======================= RENDER UTAMA ======================= */
function render() {
  const app = $('#app');
  $('#tabs').style.display = S.token && !S.user.wajibGanti ? 'flex' : 'none';
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#hdUser').innerHTML = S.token ? esc(S.user.nama) + (/admin/i.test(S.user.peran) ? '<br><span style="color:var(--gold)">Admin</span>' : '') : '';
  if (!S.token) { $('#foot').style.display = 'none'; app.innerHTML = vLogin(); bindLogin(); return; }
  if (S.user.wajibGanti) { $('#foot').style.display = 'none'; app.innerHTML = vGantiPin(true); bindGantiPin(); return; }
  if (S.tab === 'riwayat') { $('#foot').style.display = 'none'; app.innerHTML = vRiwayat(); bindRiwayat(); return; }
  if (S.tab === 'akun') { $('#foot').style.display = 'none'; app.innerHTML = vAkun(); bindAkun(); return; }
  if (S.hasil) { $('#foot').style.display = 'none'; app.innerHTML = vHasil(); bindHasil(); return; }
  $('#foot').style.display = 'flex';
  const views = [vKasus, vTim, vWbp, vTJ, vResume, vLampiran, vTtd, vKirim];
  app.innerHTML = (demo() ? '<div class="warnbar">Mode uji coba: API_URL belum diisi. Form bisa dicoba, tetapi pengiriman ke Google Drive belum aktif.</div>' : '') +
    '<div class="stepper">' + STEPS.map((s, i) => `<button data-go="${i}" class="${i === S.step ? 'on' : (i < S.step ? 'done' : '')}">${i + 1}. ${s}</button>`).join('') + '</div>' +
    views[S.step]();
  $('#btnPrev').style.visibility = S.step === 0 ? 'hidden' : 'visible';
  $('#btnNext').textContent = S.step === STEPS.length - 1 ? 'Kirim ke Google Drive ⬆' : 'Lanjut ›';

function fld(k, lbl, o = {}) {
  const v = getP(D, k) ?? '';

  if (o.type === 'textarea') return `<label>${lbl}</label>${hint}<div class="${o.mic ? 'mic' : ''}"><textarea data-k="${k}" rows="${o.rows || 3}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>${o.mic ? `<button type="button" data-mic title="Dikte suara">🎤</button>` : ''}</div>`;

  return `<label>${lbl}</label>${hint}<input data-k="${k}" type="${o.type || 'text'}" value="${esc(v)}" placeholder="${esc(o.ph || '')}" ${o.list ? `list="${o.list}"` : ''}>`;
}

function bindUmum() {

  $$('[data-go]').forEach((b) => b.onclick = () => { S.step = +b.dataset.go; simpanDraf(); render(); window.scrollTo(0, 0); });

function sigBox(k, lbl) { return `<div class="sigbox"><div class="hd"><span>${esc(lbl)}</span><button class="btn ghost sm" data-sclr="${k}">Hapus</button></div><canvas class="sig" data-sig="${k}"></canvas></div>`; }
function bindTtd() {
  $$('input[name=md]').forEach((r) => r.onchange = () => { D.ttd.mode = r.value; simpanDraf(); render(); });
  $$('[data-sig]').forEach((cv) => {
    const k = cv.dataset.sig;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const x = cv.getContext('2d'); x.scale(dpr, dpr);
    x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0b1f4d';
    const v = getP(D.ttd, k);
    if (v) { const im = new Image(); im.onload = () => x.drawImage(im, 0, 0, w, h); im.src = v; }
    let draw = false, lx = 0, ly = 0, ada = !!v;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = (e) => { draw = true; ada = true; [lx, ly] = pos(e); cv.setPointerCapture(e.pointerId); x.beginPath(); x.arc(lx, ly, 1, 0, 7); x.fill(); };
    cv.onpointermove = (e) => { if (!draw) return; const [nx, ny] = pos(e); x.beginPath(); x.moveTo(lx, ly); x.lineTo(nx, ny); x.stroke(); lx = nx; ly = ny; };
    const end = () => { if (!draw) return; draw = false; if (ada) { setP(D.ttd, k, potongTtd(cv)); simpanDraf(); } };
    cv.onpointerup = end; cv.onpointercancel = end; cv.onpointerleave = end;
  });
  $$('[data-sclr]').forEach((b) => b.onclick = () => { setP(D.ttd, b.dataset.sclr, ''); simpanDraf(); render(); });
}
function potongTtd(cv) {
  // ekspor dengan latar transparan, dipotong ke area coretan
  const x = cv.getContext('2d'); const { width: w, height: h } = cv; const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y += 2) for (let i = 0; i < w; i += 2) { if (d[(y * w + i) * 4 + 3] > 10) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
  if (x1 <= x0) return '';
  const p = 10; x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w, x1 + p); y1 = Math.min(h, y1 + p);
  const c = document.createElement('canvas'); c.width = x1 - x0; c.height = y1 - y0;
  c.getContext('2d').drawImage(cv, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}

  if (wajib.length) return toast('Lengkapi dulu: ' + wajib[0][1], 3500);
  const saran = cekData().filter(([ok, , , opt]) => !ok && opt);
  if (saran.length && !confirm('Masih ada yang belum lengkap:\n- ' + saran.map((x) => x[1]).join('\n- ') + '\n\nTetap kirim?')) return;
  if (demo()) return toast('Mode uji coba: isi API_URL di index.html agar bisa mengirim.', 4000);
  const tim = urutTim(D.tim);
  const ttdTim = {};
  if (D.ttd.mode === 'digital') urutTim(D.tim).forEach((t, i) => { if (D.ttd.tim[i]) ttdTim[i] = D.ttd.tim[i]; });
  const payload = {
    kasus: { ...D.kasus, dasarTambahan: lines(D.kasus.dasarTambahan) },
    st: D.st, tim, bap: D.bap, wbp: D.wbp, tanyaJawab: D.tanyaJawab,
    resume: { ...D.resume, keterangan: lines(D.resume.keterangan), meringankan: lines(D.resume.meringankan), memberatkan: lines(D.resume.memberatkan) },
    lampiran: D.lampiran, dokumen: D.dokumen,
    ttd: { mode: D.ttd.mode, diperiksa: D.ttd.mode === 'digital' ? D.ttd.diperiksa : '', tim: ttdTim },
    klasifikasi: D.klasifikasi, terlapor: D.klasifikasi === 'Rahasia' ? D.terlapor.filter((t) => t.nama || t.nip) : []
  };
  overlay('<div class="spin"></div><b>Mengunggah ke Google Drive…</b><p class="small">Membuat Surat Tugas, BAP, Resume, Lampiran, dan PDF. Biasanya 20–60 detik. Jangan tutup halaman.</p>');
  try {
    const r = await api('simpan', payload);
    S.hasil = r; S.riwayat = null;
    if (S.master) S.master.nomorBerikut = (S.master.nomorBerikut || 0) + 1;
    
    overlay(); render(); window.scrollTo(0, 0);
  } catch (e) {
    overlay(`<h3 style="color:var(--err)">Gagal mengirim</h3><p>${esc(e.message)}</p><p class="small">Data tetap tersimpan di perangkat ini. Periksa koneksi lalu coba lagi.</p><button class="btn" onclick="overlay()">Tutup</button>`);
  }
}
function vHasil() {
  const r = S.hasil;
  return `<div class="card res" style="text-align:center"><div style="font-size:42px">✅</div><h3>BAP berhasil disimpan ke Google Drive</h3>
    <p>Nomor: <b>${esc(r.nomor)}</b></p>
    <a class="btn" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">📄 Buka PDF (untuk dicetak)</a>
    <a class="btn sec" href="${esc(r.docUrl)}" target="_blank" rel="noopener">✏️ Buka Google Docs (bisa diedit)</a>
    <a class="btn ghost" href="${esc(r.folderUrl)}" target="_blank" rel="noopener">📁 Buka folder Drive</a>
    <p class="small">${r.jmlFoto} foto lampiran · ${r.jmlDok} dokumen pendukung</p></div>
  <div class="card"><h3>Selanjutnya</h3>
    <button class="btn" id="hsLanjut" style="width:100%">BAP Warga Binaan berikutnya (kasus & tim sama)</button>
    <button class="btn sec" id="hsBaru" style="width:100%;margin-top:8px">BAP baru (kosong)</button>
    ${D.ttd.mode !== 'digital' ? '<p class="small" style="margin-top:10px">Setelah ditandatangani basah, unggah scan berkas lewat menu <b>Riwayat → Unggah scan TTD</b>.</p>' : ''}</div>`;
}
function bindHasil() {
  $('#hsLanjut').onclick = () => { D = draftBaru(D); S.hasil = null; S.step = 2; simpanDraf(); render(); };
  $('#hsBaru').onclick = () => { D = draftBaru(); S.hasil = null; S.step = 0; simpanDraf(); render(); };
}

/* ======================= RIWAYAT ======================= */
function vRiwayat() {
  if (demo()) return '<div class="card"><h3>Riwayat</h3><p class="small">Riwayat tampil setelah API_URL diisi.</p></div>';
  if (!S.riwayat) { setTimeout(muatRiwayat, 0); return '<div class="card" style="text-align:center"><div class="spin"></div>Memuat riwayat…</div>'; }
  const q = S.cari.toLowerCase();
  const d = S.riwayat.filter((x) => !q || (x.nama + ' ' + x.nomor + ' ' + x.perihal + ' ' + x.noreg + ' ' + x.blok).toLowerCase().includes(q));
  return `<div class="card"><p class="small" style="margin:0 0 8px">${S.riwayatSemua ? 'Admin: menampilkan seluruh BAP (kecuali yang menyebut Anda).' : 'Menampilkan BAP yang Anda input atau Anda ikut menjadi tim pemeriksa. BAP RAHASIA hanya tampil untuk penginput & Admin.'}</p><div class="rowb"><input id="rwCari" placeholder="Cari nama, nomor, blok…" value="${esc(S.cari)}" style="flex:1"><button class="btn sec" id="rwMuat">↻</button></div></div>
  <div class="list">${d.length ? d.map((x) => `<div class="it">
    <div class="rowb" style="justify-content:space-between"><b>${x.rahasia ? '🔒 ' : ''}${esc(x.nama)}</b><span>${x.rahasia ? '<span class="badge" style="background:#fee4e2;color:#b42318">RAHASIA</span> ' : ''}<span class="badge ${/diunggah|digital/i.test(x.status) ? 'ok' : ''}">${esc(x.status || '-')}</span></span></div>
    ${x.rahasia && x.terlaporNama ? `<div class="meta" style="color:#b42318">Petugas disebut: ${esc(x.terlaporNama)}</div>` : ''}
    <div class="meta">${esc(x.nomor)} · ${esc(tglPanjang(x.tanggal) || x.tanggal)} ${x.blok ? '· Blok ' + esc(x.blok) : ''}</div>
    ${x.perihal ? `<div class="meta">${esc(x.perihal)}</div>` : ''}
    <div class="meta">Ketua tim: ${esc(x.ketua)} ${x.pengisi ? '· diinput ' + esc(x.pengisi) : ''}${x.milikSaya ? ' (saya)' : ''}</div>
    <div class="act"><a class="btn sm" href="${esc(x.pdfUrl)}" target="_blank" rel="noopener">PDF</a><a class="btn sec sm" href="${esc(x.docUrl)}" target="_blank" rel="noopener">Docs</a><a class="btn ghost sm" href="${esc(x.folderUrl)}" target="_blank" rel="noopener">Folder</a><button class="btn ok sm" data-sus="${esc(x.folderId)}">⬆ Unggah scan TTD</button>${S.riwayatSemua ? `<button class="btn red sm" data-kl="${esc(x.folderId)}">🔒 Klasifikasi</button>` : ''}</div>
  </div>`).join('') : '<p class="small" style="text-align:center">Belum ada data.</p>'}</div>`;
}
async function muatRiwayat() { try { const r = await api('riwayat'); S.riwayat = r.data; S.riwayatSemua = r.semua; } catch (e) { S.riwayat = []; toast(e.message); } if (S.tab === 'riwayat') render(); }
let folderSusulan = '';
function ubahKlasifikasi(x) {
  const nm = (x.terlaporNama || '').split(';').map((s) => s.trim()).filter(Boolean), np = (x.terlaporNip || '').split(',').filter(Boolean);
  const rows = (nm.length ? nm : ['']).map((n, i) => ({ nama: n, nip: np[i] || '' }));
  const baris = (t) => `<div class="g2" style="margin-bottom:6px"><input class="klNama" placeholder="Nama petugas" value="${esc(t.nama)}"><input class="klNip" inputmode="numeric" placeholder="NIP" value="${esc(t.nip)}"></div>`;
  overlay(`<div style="text-align:left"><h3>Klasifikasi BAP</h3><p class="small">${esc(x.nomor)} — ${esc(x.nama)}</p>
    <label style="display:flex;gap:8px;font-weight:500"><input type="radio" name="klx" value="Biasa" ${!x.rahasia ? 'checked' : ''} style="width:20px;height:20px">Biasa</label>
    <label style="display:flex;gap:8px;font-weight:500"><input type="radio" name="klx" value="Rahasia" ${x.rahasia ? 'checked' : ''} style="width:20px;height:20px"><b style="color:#b42318">RAHASIA</b></label>
    <label>Petugas yang disebut</label><div id="klRows">${rows.map(baris).join('')}</div>
    <button class="btn sec sm" id="klAdd">+ Tambah</button>
    <label>Alasan perubahan (tercatat di Log Akses)</label><input id="klAlasan" placeholder="mis. hasil pemeriksaan lanjutan">
    <div class="rowb" style="margin-top:12px"><button class="btn" id="klSimpan">Simpan</button><button class="btn ghost" id="klBatal">Batal</button></div>
    <p class="small">Folder akan dipindah, label RAHASIA pada dokumen ditambah/dihapus, dan PDF dibuat ulang.</p></div>`);
  $('#klAdd').onclick = () => $('#klRows').insertAdjacentHTML('beforeend', baris({ nama: '', nip: '' }));
  $('#klBatal').onclick = () => overlay();
  $('#klSimpan').onclick = async () => {
    const klasifikasi = $('input[name=klx]:checked').value;
    const terlapor = $$('#klRows .g2').map((g) => ({ nama: $('.klNama', g).value.trim(), nip: $('.klNip', g).value.trim() })).filter((t) => t.nama || t.nip);
    const alasan = $('#klAlasan').value.trim();
    if (!alasan) return toast('Isi alasan perubahan');
    overlay('<div class="spin"></div>Memperbarui klasifikasi & PDF…');
    try { await api('klasifikasi', { folderId: x.folderId, klasifikasi, terlapor, alasan, tanpaTerlapor: !terlapor.length }); overlay(); toast('Klasifikasi diperbarui'); S.riwayat = null; render(); }
    catch (e) { overlay(); toast(e.message, 4000); }
  };
}
function bindRiwayat() {
  const c = $('#rwCari'); if (c) { c.oninput = () => { S.cari = c.value; const pos = c.selectionStart; render(); const n = $('#rwCari'); n.focus(); n.setSelectionRange(pos, pos); }; }
  const m = $('#rwMuat'); if (m) m.onclick = () => { S.riwayat = null; render(); };
  $$('[data-sus]').forEach((b) => b.onclick = () => { folderSusulan = b.dataset.sus; $('#fileSusulan').click(); });
  $$('[data-kl]').forEach((b) => b.onclick = () => ubahKlasifikasi(S.riwayat.find((x) => x.folderId === b.dataset.kl)));
}
$('#fileSusulan').onchange = async (e) => {
  const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return;
  overlay('<div class="spin"></div>Mengunggah scan berkas bertanda tangan…');
  try {
    const files = [];
    for (const f of fs) files.push({ nama: f.type.startsWith('image/') ? f.name.replace(/\.\w+$/, '') + '.jpg' : f.name, data: f.type.startsWith('image/') ? await kompres(f, 2400, 0.85) : await bacaFile(f) });
    const r = await api('susulan', { folderId: folderSusulan, files });
    overlay(); toast(r.jumlah + ' file scan tersimpan'); S.riwayat = null; render();
  } catch (er) { overlay(); toast(er.message, 4000); }
};

/* ======================= DIKTE SUARA ======================= */
let rec = null;
function dikte(btn, ta) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Dikte suara tidak didukung di browser ini. Gunakan Chrome.');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = false;
  btn.classList.add('rec'); toast('Mendengarkan… tekan 🎤 lagi untuk berhenti');
  rec.onresult = (e) => {
    let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript;
    if (t) { ta.value = (ta.value ? ta.value.replace(/\s*$/, ' ') : '') + t.trim(); ta.dispatchEvent(new Event('input')); }
  };
  rec.onend = () => { btn.classList.remove('rec'); rec = null; };
  rec.onerror = (e) => { toast('Mikrofon: ' + e.error); };
  rec.start();
}

/* ======================= NAVIGASI ======================= */
$('#btnNext').onclick = () => { if (S.step === STEPS.length - 1) return kirim(); S.step++; simpanDraf(); render(); window.scrollTo(0, 0); };
$('#btnPrev').onclick = () => { if (S.step > 0) { S.step--; simpanDraf(); render(); window.scrollTo(0, 0); } };
$$('#tabs button').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
document.addEventListener('click', (e) => {
  if (e.target.id === 'cpKron') { D.kasus.kronologi = D.kasus.ringkasan; simpanDraf(); render(); }
});

/* ======================= KUNCI OTOMATIS (30 menit tidak aktif) ======================= */
let aktifTerakhir = Date.now();
['pointerdown', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, () => { aktifTerakhir = Date.now(); }, { passive: true }));
setInterval(() => { if (S.token && Date.now() - aktifTerakhir > 30 * 60 * 1000 && !rec) { keluar(false); toast('Keluar otomatis karena tidak aktif. Draf tetap tersimpan.', 5000); } }, 30000);

/* ======================= MULAI ======================= */
(async function init() {
  await IDB.open();
  try { const l = JSON.parse(localStorage.getItem('bap_sesi') || 'null'); if (l && l.token) { S.token = l.token; S.user = l.user; } } catch (e) {}
  if (S.token) {
    const dr = await IDB.get(kunciDraf());
    if (dr && dr.D) { D = Object.assign(draftBaru(), dr.D); S.step = dr.step || 0; }
    if (!S.user.wajibGanti) { try { await muatMaster(); } catch (e) { if (S.token) toast('Gagal memuat data tim: ' + e.message, 4000); } }
  }
  render();
})();
</script>
